name: Capstone Loop - Dependency & Lint Audit

on:
  schedule:
    - cron: '0 9 * * 1'  # Every Monday 9:00 AM UTC
  workflow_dispatch:
    inputs:
      force_run:
        description: 'Force audit run'
        required: false
        default: 'false'

permissions:
  contents: write
  pull-requests: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest pip-audit safety requests pydantic click rich

      - name: Configure git
        run: |
          git config user.name "capstone-loop[bot]"
          git config user.email "capstone-loop[bot]@users.noreply.github.com"

      - name: Install gh CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y gh

      - name: Authenticate gh
        run: gh auth setup-git
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Capstone Loop
        id: loop
        run: python scripts/capstone_loop.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-report-${{ github.run_number }}
          path: progress.md
          retention-days: 30
